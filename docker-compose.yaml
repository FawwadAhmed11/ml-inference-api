version: '3.8'

services:
  # ML API
  ml-api:
    build: .
    image: model-serve:v1
    container_name: ml-api
    ports:
      - "8000:8000"
    # environment:
    #   - LOG_LEVEL=info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - ml-network
    restart: unless-stopped
    volumes: 
      - ./src/model-serve/models:/app/models:ro
      - ./src/model-serve/logs:/app/logs
    environment:
      - MODEL_PATH=/app/models/resnet18.pth
      - LOG_LEVEL=info

  # Prometheus monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    networks:
      - ml-network
    restart: unless-stopped


  # Grafana visualization
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - ml-network
    depends_on:
      - prometheus
    restart: unless-stopped
  
  redis:
    image: redis:7-alpine
    container_name: redis-cache
    ports:
      - "6379:6379"
    networks:
      - ml-network
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data

networks:
  ml-network:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
  redis-data:
